name: Bootstrap lockfiles

on:
  push:
    branches:
      - task/FND-001-fundacao-repositorio-ci
    paths:
      - apps/web/package.json
      - apps/instance-api/composer.json
      - apps/control-plane/composer.json
      - .github/workflows/bootstrap-lockfiles.yml

permissions:
  contents: write

jobs:
  lockfiles:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: task/FND-001-fundacao-repositorio-ci

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Generate npm lockfile
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Generate Instance API composer.lock
        working-directory: apps/instance-api
        run: composer update --no-install --no-interaction --prefer-dist --no-progress

      - name: Generate Control Plane composer.lock
        working-directory: apps/control-plane
        run: composer update --no-install --no-interaction --prefer-dist --no-progress

      - name: Commit lockfiles
        shell: bash
        run: |
          if git diff --quiet -- apps/web/package-lock.json apps/instance-api/composer.lock apps/control-plane/composer.lock; then
            echo "Lockfiles already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json apps/instance-api/composer.lock apps/control-plane/composer.lock
          git commit -m "build: gera lockfiles da fundação"
          git push
